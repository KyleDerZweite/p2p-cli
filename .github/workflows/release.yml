name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Check Linux terminal workflow
        run: python3 tests/linux_smoke.py target/release/p2p-cli
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/p2p-cli p2p-cli-linux-x86_64
          gh release upload "${{ github.ref_name }}" p2p-cli-linux-x86_64 --clobber
